name: Prepare release
run-name: Prepare release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (X.Y.Z, without v)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Require main branch
        env:
          SELECTED_REF: ${{ github.ref }}
        run: |
          if [[ "$SELECTED_REF" != refs/heads/main ]]; then
            echo "::error::Run Prepare release on the main branch."
            exit 1
          fi

      - name: Check out latest main and all tags
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Validate and update version
        run: python3 -B .github/scripts/release.py prepare-version "$RELEASE_VERSION"

      - name: Commit version and push main and tag atomically
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- app/build.gradle.kts
          git commit -m "chore: release $RELEASE_VERSION"
          git tag -a "v$RELEASE_VERSION" -m "EasyGamepad $RELEASE_VERSION"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/v$RELEASE_VERSION"

      - name: Dispatch publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B .github/scripts/release.py dispatch "v$RELEASE_VERSION"
